name: Student starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ComputerVision.Student.slnx
      - name: Build
        run: dotnet build ComputerVision.Student.slnx -c Release --no-restore
      - name: Verify code style
        shell: pwsh
        run: ./tools/Check-CodeStyle.ps1
      - name: Unit and regression tests
        run: dotnet test tests/ComputerVision.Tests/ComputerVision.Tests.csproj -c Release --no-build
      - name: Verify and process the course dataset
        run: dotnet run --project ComputerVision.Runner -c Release --no-build -- evaluate data/course results/evaluation.json
